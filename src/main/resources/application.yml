spring:
  application:
    name: spring-architecture-patterns
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:https://auth.example.test}
          public-key-location: ${JWT_PUBLIC_KEY_LOCATION:classpath:security/demo-public-key.pem}
          audiences:
            - ${JWT_AUDIENCE:returns-api}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/returns}
    username: ${DATABASE_USER:returns}
    password: ${DATABASE_PASSWORD:returns}
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      completion-mode: update
      republish-outstanding-events-on-restart: false
      jdbc:
        schema-initialization:
          enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

logging:
  level:
    org.hibernate.SQL: warn
  pattern:
    level: "%5p [requestId:%X{requestId:-}]"

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, eventpublications
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-components: never
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}

info:
  application:
    name: ${spring.application.name}
    description: Modular returns and refunds reference application
